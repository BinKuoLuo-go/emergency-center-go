
server:
  # 监听端口
  port: 8812
  # 运行模式：debug / release / test
  mode: release

sqlite:
  # SQLite 数据库文件路径
  path: ./data/emergency-center.db
  # 是否打印 SQL 调试日志
  log-mode: false


mysql:
  host: 127.0.0.1
  port: 3306
  user: root
  password: "1234abcd"
  database: emergency_center
  charset: utf8mb4
  max_idle_conns: 10
  max_open_conns: 100

redis:
  host: 127.0.0.1
  port: 6379
  password: ""
  database: 7
  pool_size: 10


mqtt:
  # 是否启用 MQTT 订阅 接收边缘端告警等消息后写入MySQL
  enabled: true
  # MQTT Broker 地址
  broker: "tcp://10.254.1.6:1883"
  # 客户端 ID
  client_id: "emergency-center"
  username: "admin"
  password: "1234abcd"
  # 订阅主题：# 通配所有 companyCode/deviceId 的告警消息
  topic: "emergency/alarm/#"
  # 设备状态订阅主题：# 通配所有 deviceId 的设备状态消息
  status_topic: "emergency/status/#"


province:
  # 是否启用省平台上报
  enabled: false
  # 省平台接口基地址，如 https://xx.xx.xx
  base_url: ""
  # 上报接口路径，默认 /v2/data/receive/device/gatherAlarm
  endpoint: "/v2/data/receive/device/gatherAlarm"
  # token 获取接口地址
  token_url: ""
  # AES-GCM-256 密钥（hex，32 字节）
  aes_key: ""
  # AES-GCM-256 IV（hex，16 字节）
  aes_iv: ""
  # 单次上报请求超时（秒）
  timeout_sec: 10

log:
  # 日志等级：debug / info / warn / error
  level: info
  # 输出格式：text（人读）| json（采集）
  format: text
  # 输出目标：stdout | file | both
  output: both
  file:
    path: logs/emergency-center.log
    max_size_mb: 50
    max_backups: 10
    max_age_days: 10
    compress: true
