
server:
  # 监听端口
  port: 8812
  # 运行模式：debug / release / test
  mode: release

sqlite:
  # SQLite 数据库文件路径
  path: ./data/emergency-center.db
  # 是否打印 SQL 调试日志
  log-mode: false


mysql:
  host: 127.0.0.1
  port: 3306
  user: root
  password: "1234abcd"
  database: emergency_center
  charset: utf8mb4
  max_idle_conns: 10
  max_open_conns: 100

redis:
  host: 127.0.0.1
  port: 6379
  password: ""
  database: 7
  pool_size: 10


mqtt:
  # 是否启用 MQTT 订阅 接收边缘端告警等消息后写入MySQL
  enabled: true
  # MQTT Broker 地址
  broker: "tcp://127.0.0.1:1883"
  # 客户端 ID（中心平台唯一）
  client_id: "emergency-center"
  username: "admin"
  password: "1234abcd"
  # 订阅主题：# 通配所有 companyCode/deviceId 的告警消息
  topic: "emergency/alarm/#"
  # 设备状态订阅主题：# 通配所有 deviceId 的设备状态消息
  status_topic: "emergency/status/#"


log:
  # 日志等级：debug / info / warn / error
  level: info
  # 输出格式：text（人读）| json（采集）
  format: text
  # 输出目标：stdout | file | both
  output: both
  file:
    path: logs/emergency-center.log
    max_size_mb: 50
    max_backups: 10
    max_age_days: 10
    compress: true
